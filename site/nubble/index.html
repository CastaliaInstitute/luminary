<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071725">
  <meta name="description" content="A live, weather-aware sea and sky for the Nubble Luminary.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nubble">
  <title>Nubble Luminary</title>
  <link rel="manifest" href="/nubble/manifest.webmanifest?v=3">
  <link rel="stylesheet" href="/nubble/nubble.css?v=3">
  <link rel="icon" href="/nubble/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/nubble/icons/icon-192.png">
</head>
<body>
  <main class="stage" aria-label="Nubble live sea and sky">
    <canvas id="scene" width="1024" height="600" aria-label="Animated Nubble sea and sky"></canvas>

    <section class="hud is-hidden" aria-live="polite">
      <div>
        <p class="eyebrow">YORK, MAINE · LIVE</p>
        <p id="conditions">Loading local conditions…</p>
      </div>
      <div class="hud-actions">
        <button id="install" hidden>Install</button>
        <button id="island-toggle" aria-pressed="false">Island</button>
        <button id="fullscreen" aria-label="Enter fullscreen">Fullscreen</button>
        <button id="hud-toggle" aria-label="Hide information">Hide</button>
      </div>
    </section>

    <button id="show-hud" class="show-hud">Info</button>
    <div id="offline" class="offline" hidden>Offline · using last conditions</div>
  </main>
  <script src="/nubble/nubble.js?v=3" defer></script>
</body>
</html>
