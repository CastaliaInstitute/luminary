<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06131d">
  <meta name="description" content="Live sea and sky at Cliff House Maine, registered to the Luminary relief.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cliff House">
  <title>Cliff House Luminary</title>
  <link rel="canonical" href="https://luminary.castalia.institute/cliffhouse/">
  <link rel="manifest" href="./manifest.webmanifest?v=3">
  <link rel="stylesheet" href="./cliff-house.css?v=3">
</head>
<body>
  <main class="stage" aria-label="Cliff House live sea and sky">
    <canvas id="scene" width="2600" height="1200"></canvas>
    <section id="hud" class="hud" hidden>
      <strong>CLIFF HOUSE · CAPE NEDDICK · LIVE</strong>
      <span id="conditions">Loading conditions…</span>
    </section>
    <div id="offline" class="offline" hidden>Offline · cached conditions</div>
  </main>
  <script type="module" src="./cliff-house.js?v=3"></script>
</body>
</html>
