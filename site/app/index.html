<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182321">
  <meta name="description" content="Luminary PWA shell for field controls and project access.">
  <title>Luminary App | CastaliaInstitute</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="stylesheet" href="/app/app.css">
  <link rel="icon" href="/app/icon.svg">
</head>
<body>
  <main>
    <h1>Luminary</h1>
    <p>This is the Luminary PWA shell at <code>/app</code>.</p>
    <p>Use this surface for future app controls while keeping the existing project site at <a href="/">/</a>.</p>
    <ul>
      <li>Installable via browser prompt when supported.</li>
      <li>Offline-capable shell through service worker.</li>
      <li>Back to the live project site: <a href="/">Home</a>.</li>
    </ul>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/app/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
