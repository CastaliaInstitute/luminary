<?xml version="1.0" encoding="UTF-8"?>
<!-- White-print architectural insert. The lantern glazing is intentionally absent:
     the display remains visible through the open window. -->
<svg xmlns="http://www.w3.org/2000/svg" width="142.4mm" height="91.6mm" viewBox="0 0 142.4 91.6">
  <g fill="#000">
    <!-- left cottage -->
    <path d="M36 40.8 L36 36.4 L39 33.5 L42.3 36.8 L42.3 41.0 Z"/>
    <!-- small shore shed -->
    <path d="M45.1 40.8 L45.1 38.0 L47.7 36.5 L50.0 39.2 L50.0 41.1 Z"/>
    <!-- keeper house, roof and chimney -->
    <path d="M53 39.2 L53 30.8 L57.0 26.3 L60.6 30.1 L63.4 30.1 L66.1 35.0 L66.1 39.4 Z"/>
    <path d="M57.8 27.4 L57.8 23.8 L59.5 23.8 L59.5 28.7 Z"/>
    <!-- service wing -->
    <path d="M66.1 39.4 L66.1 35.7 L69.2 35.7 L69.2 39.4 Z"/>
    <!-- lighthouse tower, roof/cap, and two lantern-side mullions.
         The central 3 mm-wide glazing opening is not printed. -->
    <!-- Tower stops below the lantern; the centre glazing stays genuinely open. -->
    <path d="M70.5 38.8 L71.0 18.7 L74.6 18.7 L75.1 38.8 Z"/>
    <path d="M70.2 17.4 L70.2 15.5 L75.4 15.5 L75.4 17.4 Z"/>
    <path d="M70.6 15.5 L72.8 13.2 L75.0 15.5 Z"/>
    <path d="M70.35 15.5 L71.05 15.5 L71.05 18.7 L70.35 18.7 Z"/>
    <path d="M74.55 15.5 L75.25 15.5 L75.25 18.7 L74.55 18.7 Z"/>
  </g>
</svg>
